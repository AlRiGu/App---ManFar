workflows:
  ios-workflow:
    name: ManFar iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - ios_signing  # lo creas luego en Codemagic si quieres firmar
    scripts:
      - name: Build iOS app (unsigned, simulator)
        script: |
          cd $CM_BUILD_DIR
          chmod +x ./gradlew
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            build
    artifacts:
      - build/**/*.app
