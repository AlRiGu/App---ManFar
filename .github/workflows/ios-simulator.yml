name: ManFar iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Asignar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Pre-compilar framework Kotlin para iOS Simulator
        run: |
          ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Verificar versión de Xcode
        run: xcodebuild -version

      - name: Compilar para el simulador de iOS
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Empaquetar aplicación (.zip)
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y ManFar-iOS-Simulator.zip iosApp.app

      - name: Guardar aplicación compilada
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ManFar-iOS-Simulator
          path: |
            build/Build/Products/Debug-iphonesimulator/iosApp.app
            build/Build/Products/Debug-iphonesimulator/ManFar-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
